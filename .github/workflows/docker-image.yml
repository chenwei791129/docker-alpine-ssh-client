name: Docker Image CI

# The build itself lives in chenwei791129/.github so the pinned action versions
# are maintained in exactly one place across repositories.
#
# Publishes to ghcr.io only. The Docker Hub push was dropped deliberately: its
# pull-rate and retention limits keep tightening, and this account is
# standardising on ghcr.io.
#
# Trigger only when the Dockerfile or this workflow changes on main.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

jobs:
  build-and-push-image:
    permissions:
      contents: read
      packages: write
    uses: chenwei791129/.github/.github/workflows/build-and-push-image.yml@main
    with:
      # ghcr path keeps the short image name this project published under,
      # rather than the docker- prefixed repository name.
      image-name: chenwei791129/alpine-ssh-client
      enable-branch-tag: false
      enable-latest-tag: false
      enable-semver-tags: false
      # The alpine base version is repeated below rather than held in a job-level
      # `env`, because the `env` context is not available to a reusable
      # workflow's `with:` block. Bump both occurrences together.
      additional-tags: |
        type=semver,pattern={{raw}}
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=alpine,enable={{is_default_branch}}
        type=raw,value=alpine-3.23.3,enable={{is_default_branch}}
      build-args: |
        BASE_TAG=3.23.3
